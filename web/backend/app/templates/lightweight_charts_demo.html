                    console.error('MACD数据加载失败:', error);
                }
            }
            if (token !== rangeStatsToken) return;
            const start = Math.min(from, to);
            const end = Math.max(from, to);
            const bars = candleData.slice(start, end + 1);
            rangePopup.innerHTML = '';
            const header = document.createElement('div');
            header.className = 'range-popup-header';
            const title = document.createElement('span');
            title.textContent = '区间统计';
            const closeButton = document.createElement('button');
            closeButton.type = 'button';
            closeButton.className = 'range-popup-close';
            closeButton.textContent = '×';
            closeButton.title = '关闭';
            closeButton.addEventListener('click', event => {
                event.stopPropagation();
                clearRangeSelection();
            });
            header.append(title, closeButton);
            rangePopup.appendChild(header);

            if (!bars.length) {
                appendStat(rangePopup, '结果', '范围内没有K线');
            } else {
                const first = bars[0];
                const last = bars[bars.length - 1];
                const startPrice = first.open;
                const endPrice = last.close;
                let high = first.high;
                let low = first.low;
                let bullish = 0;
                let bearish = 0;
                let flat = 0;
                let volume = 0;
                bars.forEach(bar => {
                    if (bar.high > high) high = bar.high;
                    if (bar.low < low) low = bar.low;
                    if (bar.close.toFixed(currentPrecision) === bar.open.toFixed(currentPrecision)) flat += 1;
                    else if (bar.close > bar.open) bullish += 1;
                    else bearish += 1;
                    volume += volumeLookup[bar.time] || 0;
                });
                const change = endPrice - startPrice;
                const changePct = startPrice ? change / startPrice * 100 : 0;
                const amplitude = startPrice ? (high - low) / startPrice * 100 : 0;
                const changeClass = change > 0 ? 'up' : change < 0 ? 'down' : '';
                const signed = value => (value > 0 ? '+' : '') + value.toFixed(currentPrecision);
                const signedPct = value => (value > 0 ? '+' : '') + value.toFixed(2) + '%';
                appendStat(rangePopup, '开始时间', formatDateTime(first.time));
                appendStat(rangePopup, '结束时间', formatDateTime(last.time));
                appendStat(rangePopup, '起始价', startPrice.toFixed(currentPrecision));
                appendStat(rangePopup, '终止价', endPrice.toFixed(currentPrecision));
                appendStat(rangePopup, '周期个数', String(bars.length));
                appendStat(rangePopup, '最高价', high.toFixed(currentPrecision));
                appendStat(rangePopup, '最低价', low.toFixed(currentPrecision));
                appendStat(rangePopup, '涨跌值', signed(change), changeClass);
                appendStat(rangePopup, '涨跌幅', signedPct(changePct), changeClass);
                appendStat(rangePopup, '振幅', amplitude.toFixed(2) + '%');
                appendStat(rangePopup, '总成交量', formatVolume(volume));
                appendStat(rangePopup, '平线数量', String(flat));
                appendStat(rangePopup, '阳线数量', String(bullish));
                appendStat(rangePopup, '阴线数量', String(bearish));
                let redArea = 0;
                let greenArea = 0;
                let hasMacd = false;
                bars.forEach(bar => {
                    const stat = macdStatLookup[bar.time];
                    if (!stat || typeof stat.macd !== 'number') return;
                    hasMacd = true;
                    const area = stat.macd * 100;
                    if (area > 0) redArea += area;
                    else if (area < 0) greenArea += area;
                });
                if (!hasMacd) {
                    appendStat(rangePopup, '阳柱面积', '—');
                    appendStat(rangePopup, '阴柱面积', '—');
                } else {
                    appendStat(rangePopup, '阳柱面积', (redArea > 0 ? '+' : '') + redArea.toFixed(1), redArea > 0 ? 'up' : '');
                    appendStat(rangePopup, '阴柱面积', greenArea.toFixed(1), greenArea < 0 ? 'down' : '');
                }
                if (priceTop == null || priceBottom == null) {
                    priceTop = high;
                    priceBottom = low;
                }
            }

            rangeSelection = bars.length ? { from: start, to: end, priceTop, priceBottom } : null;
            layoutRangeBox();
            placeRangePopup();
        };

        chartContainer.addEventListener('contextmenu', event => event.preventDefault());
        chartContainer.addEventListener('mousedown', event => {
            if (event.button !== 2 || event.target.closest('.range-popup')) return;
            if (measureState.enabled || measureState.start || measureState.end) {
                event.preventDefault();
                event.stopPropagation();
                clearMeasure();
                return;
            }
            event.preventDefault();
            event.stopPropagation();
            const point = chartPoint(event);
            rangeDrag.active = true;
            rangeStatsToken += 1;
            rangeDrag.x = point.x;
            rangeDrag.y = point.y;
            rangePopup.hidden = true;
            paintRangeBox(point.x, point.y, point.x, point.y);
        }, true);
        window.addEventListener('mousemove', event => {
            if (!rangeDrag.active) return;
            event.preventDefault();
            const point = chartPoint(event);
            paintRangeBox(rangeDrag.x, rangeDrag.y, point.x, point.y);
        });
        window.addEventListener('mouseup', event => {
            if (!rangeDrag.active) {
                if (rangeSelection) layoutRangeBox();
                return;
            }
            rangeDrag.active = false;
            const point = chartPoint(event);
            const moved = Math.hypot(point.x - rangeDrag.x, point.y - rangeDrag.y);
            if (moved < 4) {
                clearRangeSelection();
                return;
            }
            const from = logicalIndex(chart.timeScale().coordinateToLogical(Math.min(rangeDrag.x, point.x)));
            const to = logicalIndex(chart.timeScale().coordinateToLogical(Math.max(rangeDrag.x, point.x)));
            if (from == null || to == null) {
                clearRangeSelection();
                return;
            }
            const priceA = candlestickSeries.coordinateToPrice(rangeDrag.y);
            const priceB = candlestickSeries.coordinateToPrice(point.y);
            const priceTop = priceA == null || priceB == null ? null : Math.max(priceA, priceB);
            const priceBottom = priceA == null || priceB == null ? null : Math.min(priceA, priceB);
            showRangeStats(from, to, priceTop, priceBottom);
        });
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => layoutRangeBox());
        chartContainer.addEventListener('wheel', () => requestAnimationFrame(layoutRangeBox), { passive: true });
        window.addEventListener('resize', () => layoutRangeBox());
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') clearRangeSelection();
        });
        rangePopup.addEventListener('mousedown', event => event.stopPropagation());

        // 距离测量：两次点击确定起点和终点，显示周期、涨跌点数、涨跌幅度
        const measureSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        measureSvg.setAttribute('class', 'measure-overlay');
        const measureLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        measureLine.setAttribute('stroke-width', '1.5');
        const measureStartDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const measureEndDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        [measureStartDot, measureEndDot].forEach(dot => {
            dot.setAttribute('r', '3');
            dot.setAttribute('fill', '#fff');
            dot.setAttribute('stroke-width', '1.5');
        });
        measureSvg.append(measureLine, measureStartDot, measureEndDot);
        const measureLabel = document.createElement('div');
        measureLabel.className = 'measure-label';
        measureLabel.hidden = true;
        chartContainer.append(measureSvg, measureLabel);

        const distanceButton = document.getElementById('toolDistance');
        const distanceHint = document.getElementById('toolDistanceHint');
        const measureState = { enabled: false, start: null, end: null };

        const signedText = (value, digits) => (value > 0 ? '+' : '') + value.toFixed(digits);

        const measurePointFromParam = param => {
            if (!param || !param.point) return null;
            const logical = param.logical != null
                ? param.logical
                : chart.timeScale().coordinateToLogical(param.point.x);
            const index = logicalIndex(logical);
            const price = candlestickSeries.coordinateToPrice(param.point.y);
            if (index == null || price == null) return null;
            return { index, price };
        };

        const measurePixels = point => {
            const x = chart.timeScale().logicalToCoordinate(point.index);
            const y = candlestickSeries.priceToCoordinate(point.price);
            if (x == null || y == null) return null;
            return { x, y };
        };

        const updateDistanceHint = () => {
            if (!measureState.enabled) {
                distanceHint.hidden = true;
                return;
            }
            distanceHint.hidden = false;
            if (!measureState.start) distanceHint.textContent = '点击起点，再点击终点，右键取消';
            else if (!measureState.end) distanceHint.textContent = '点击终点，右键取消';
            else distanceHint.textContent = '可再次点击重新测量，右键取消';
        };

        const renderMeasure = (target) => {
            measureSvg.setAttribute('width', String(chartContainer.clientWidth));
            measureSvg.setAttribute('height', String(chartContainer.clientHeight));
            const endPoint = measureState.end || target;
            const startPx = measureState.start ? measurePixels(measureState.start) : null;
            const endPx = endPoint ? measurePixels(endPoint) : null;
            if (!startPx || !endPx) {
                measureLine.style.display = 'none';
                measureStartDot.style.display = 'none';
                measureEndDot.style.display = 'none';
                measureLabel.hidden = true;
                return;
            }
            const delta = endPoint.price - measureState.start.price;
            const color = '#7c4dff';
            measureLine.style.display = '';
            measureLine.setAttribute('x1', String(startPx.x));
            measureLine.setAttribute('y1', String(startPx.y));
            measureLine.setAttribute('x2', String(endPx.x));
            measureLine.setAttribute('y2', String(endPx.y));
            measureLine.setAttribute('stroke', color);
            [measureStartDot, measureEndDot].forEach(dot => {
                dot.style.display = '';
                dot.setAttribute('stroke', color);
            });
            measureStartDot.setAttribute('cx', String(startPx.x));
            measureStartDot.setAttribute('cy', String(startPx.y));
            measureEndDot.setAttribute('cx', String(endPx.x));
            measureEndDot.setAttribute('cy', String(endPx.y));
            const periods = Math.abs(endPoint.index - measureState.start.index);
            const pct = measureState.start.price ? delta / measureState.start.price * 100 : 0;
            measureLabel.className = 'measure-label' + (delta > 0 ? ' up' : delta < 0 ? ' down' : '');
            measureLabel.textContent = `周期 ${periods}\n涨跌 ${signedText(delta, currentPrecision)}\n幅度 ${signedText(pct, 2)}%`;
            measureLabel.hidden = false;
            const labelWidth = measureLabel.offsetWidth;
            const labelHeight = measureLabel.offsetHeight;
            let left = (startPx.x + endPx.x) / 2 + 8;
            let top = (startPx.y + endPx.y) / 2 - labelHeight - 8;
            if (left + labelWidth > chartContainer.clientWidth - 8) left = chartContainer.clientWidth - labelWidth - 8;
            if (left < 8) left = 8;
            if (top < 8) top = Math.min(chartContainer.clientHeight - labelHeight - 8, (startPx.y + endPx.y) / 2 + 8);
            if (top + labelHeight > chartContainer.clientHeight - 8) top = chartContainer.clientHeight - labelHeight - 8;
            measureLabel.style.left = left + 'px';
            measureLabel.style.top = top + 'px';
        };

        const clearMeasure = () => {
            measureState.enabled = false;
            measureState.start = null;
            measureState.end = null;
            distanceButton.classList.remove('active');
            distanceButton.setAttribute('aria-pressed', 'false');
            chartContainer.classList.remove('measure-mode');
            updateDistanceHint();
            renderMeasure(null);
        };

        distanceButton.addEventListener('click', () => {
            measureState.enabled = !measureState.enabled;
            distanceButton.classList.toggle('active', measureState.enabled);
            distanceButton.setAttribute('aria-pressed', String(measureState.enabled));
            chartContainer.classList.toggle('measure-mode', measureState.enabled);
            if (!measureState.enabled && !measureState.end) {
                measureState.start = null;
                renderMeasure(null);
            }
            updateDistanceHint();
        });

        chart.subscribeClick(param => {
            if (!measureState.enabled) return;
            const point = measurePointFromParam(param);
            if (!point) return;
            if (!measureState.start || measureState.end) {
                measureState.start = point;
                measureState.end = null;
            } else {
                measureState.end = point;
            }
            updateDistanceHint();
            renderMeasure(measureState.end);
        });
        chart.subscribeCrosshairMove(param => {
            if (!measureState.enabled || !measureState.start || measureState.end) return;
            renderMeasure(measurePointFromParam(param));
        });
        const layoutMeasure = () => {
            if (!measureState.start) return;
            renderMeasure(measureState.end);
        };
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => layoutMeasure());
        chartContainer.addEventListener('wheel', () => requestAnimationFrame(layoutMeasure), { passive: true });
        window.addEventListener('resize', () => layoutMeasure());
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') clearMeasure();
        });


    }
</script>
</body>
</html>

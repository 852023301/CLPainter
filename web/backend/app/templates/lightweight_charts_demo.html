<script>
    // 智能日期格式化：只有年月日则显示 YYYY-MM-DD，带时分则显示 YYYY-MM-DD HH:MM
    function formatDateTime(time) {
        let date;
        if (typeof time === 'number') {
            date = new Date(time * 1000);
        } else if (typeof time === 'string') {
            date = new Date(time);
        } else {
            return String(time);
        }
        const pad = (n) => String(n).padStart(2, '0');
        const datePart = `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())}`;
        const hours = date.getUTCHours();
        const minutes = date.getUTCMinutes();
        if (hours === 0 && minutes === 0) {
            return datePart;
        }
        return `${datePart} ${pad(hours)}:${pad(minutes)}`;
    }
</script>

<script>
    // localStorage 持久化辅助(必须放在所有使用者之前, 否则触发 TDZ ReferenceError)
    const lsGetBool = (k, def) => {
        const v = localStorage.getItem(k);
        return v === null ? def : v === '1';
    };
    const lsSetBool = (k, v) => localStorage.setItem(k, v ? '1' : '0');
    const lsGetString = (k, def) => {
        const v = localStorage.getItem(k);
        return v === null ? def : v;
    };
    const lsSetString = (k, v) => localStorage.setItem(k, v);

    // 从后端传入的数据
    const candleData = {{ candle_data | safe }};
    const biData = {{ bi_data | safe }};
    const xdData = {{ xd_data | safe }};
    const zhongshuData = {{ zhongshu_data | safe }};
    const zhongshuInXianduanData = {{ zhongshu_in_xianduan_data | safe }};
    const xianduanZhongshuData = {{ xianduan_zhongshu_data | safe }};
    const gapsData = {{ gaps_data | safe }};
    const volumeData = {{ volume_data | safe }};
        const macdData = {{ macd_data | safe }};  // MACD(10,21,7): {lines:[DIFF,DEA], stats:[per-bar], markers:[area]}
        const maData = {{ ma_data | safe }};      // 后端计算的 MA 列表:   [{key, label, color, values:[{time,value}]}]
        const bollData = {{ boll_data | safe }};  // 后端计算的 BOLL 列表: [{key, label, color, values:[{time,value}]}]
        const rsiData = {{ rsi_data | safe }};    // 后端计算的 RSI 列表:  [{key, label, color, values:[{time,value}]}]
    const currentPrecision = {{ precision }};  // 当前精度

    console.log('收到的K线数据:', candleData.length);
    console.log('收到的笔数据:', biData.length);
    console.log('收到的线段数据:', xdData.length);
    console.log('收到的缺口数据:', gapsData.length);
    console.log('收到的成交量数据:', volumeData.length);
    console.log('当前精度:', currentPrecision);


    if (!candleData || !Array.isArray(candleData) || candleData.length === 0) {
        document.getElementById('chart').innerHTML = '<p style="color:red;text-align:center;padding-top:250px;">数据加载失败</p>';
    } else {
        const chartContainer = document.getElementById('chart');
        const tooltip = document.getElementById('ohlcTooltip');
        if (!window.LightweightCharts) {
            document.getElementById('chart').innerHTML =
                '<p style="color:red;text-align:center;padding-top:250px;">图表组件加载失败，请联系管理员</p>';
            throw new Error('Lightweight Charts 加载失败');
        }
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: 600,
            layout: {
                background: {color: '#ffffff'},
                textColor: '#333',
            },
            grid: {
                vertLines: {color: '#e0e0e0'},
                horzLines: {color: '#e0e0e0'},
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: {
                    width: 1,
                    color: '#758694',
                    style: 2, // 虚线
                },
                horzLine: {
                    width: 1,
                    color: '#758694',
                    style: 2, // 虚线
                },
            },
            timeScale: { // 调整缩放时显示的k线数量，下方还有一个关于成交量缩放的部分也要修改
                timeVisible: true,
                rightOffset: 0,
                barSpacing: 4,        // K线间距,增大此值会让K线显示更稀疏
                minBarSpacing: 0.2,    // 最小K线间距,减小此值允许更多K线同时显示
                fixLeftEdge: false,    // 不固定左边缘,允许滚动查看更多历史数据
                fixRightEdge: false,   // 不固定右边缘
            },
            rightPriceScale: {
                visible: true,
                autoScale: true,
            },
            leftPriceScale: {
                visible: false,
            },
            localization: {
                timeFormatter: (time) => formatDateTime(time),
            },
        });

        // 1. 创建K线系列
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#ef5350',
            downColor: '#26a69a',
            borderVisible: false,
            wickUpColor: '#ef5350',
            wickDownColor: '#26a69a',
        });
        candlestickSeries.setData(candleData);

        // 使用 Series Primitive 绘制中枢框，保持缩放和滚动时与图表同步
        function createZhongshuPrimitive(chart, series, items, fillColor, borderColor, borderDash = []) {
            const state = {
                chart,
                series,
                items,
                views: items.map(createPaneView),
                visible: true,
            };
            let requestChartUpdate = null;

            function createPaneView(item) {
                let rectangle = null;

                return {
                    zOrder() {
                        return 'bottom';
                    },
                    renderer() {
                        return {
                            draw(target) {
                                if (!rectangle) {
                                    return;
                                }

                                target.useMediaCoordinateSpace(scope => {
                                    const ctx = scope.context;
                                    ctx.save();
                                    ctx.beginPath();
                                    ctx.rect(
                                        rectangle.left,
                                        rectangle.top,
                                        rectangle.width,
                                        rectangle.height
                                    );
                                    ctx.fillStyle = fillColor;
                                    ctx.fill();
                                    ctx.lineWidth = 1.5;
                                    ctx.strokeStyle = borderColor;
                                    ctx.setLineDash(borderDash);
                                    ctx.stroke();
                                    ctx.restore();
                                });
                            },
                        };
                    },
                    update() {
                        const chartApi = state.chart;
                        const seriesApi = state.series;
                        const left = chartApi.timeScale().timeToCoordinate(item.start_time);
                        const right = chartApi.timeScale().timeToCoordinate(item.end_time);
                        const top = seriesApi.priceToCoordinate(item.high_price);
                        const bottom = seriesApi.priceToCoordinate(item.low_price);

                        rectangle = left === null || right === null || top === null || bottom === null ? null : {
                            left: Math.min(left, right),
                            top: Math.min(top, bottom),
                            width: Math.abs(right - left),
                            height: Math.abs(bottom - top),
                        };
                    },
                };
            }

            return {
                attached({ requestUpdate }) {
                    requestChartUpdate = requestUpdate;
                },
                requestUpdate() {
                    if (requestChartUpdate) {
                        requestChartUpdate();
                    }
                },
                setVisible(visible) {
                    if (state.visible === visible) {
                        return;
                    }

                    state.visible = visible;
                    if (requestChartUpdate) {
                        requestChartUpdate();
                    }
                },
                updateAllViews() {
                    state.views.forEach(view => view.update());
                },
                paneViews() {
                    return state.visible ? state.views : [];
                },
            };
        }

        const primitiveLayerMap = {};
        function registerZhongshuLayer(key, items, fillColor, borderColor, borderDash = []) {
            if (!items.length || typeof candlestickSeries.attachPrimitive !== 'function') {
                primitiveLayerMap[key] = { applyOptions: () => {} };
                return;
            }

            const primitive = createZhongshuPrimitive(
                chart,
                candlestickSeries,
                items,
                fillColor,
                borderColor,
                borderDash
            );
            candlestickSeries.attachPrimitive(primitive);
            primitiveLayerMap[key] = {
                applyOptions: ({ visible }) => primitive.setVisible(visible),
            };
        }

        registerZhongshuLayer(
            'biZhongshu', zhongshuData,
            'rgba(0, 172, 193, 0.18)', '#00acc1'
        );
        registerZhongshuLayer(
            'zhongshuInXianduan', zhongshuInXianduanData,
            'rgba(156, 39, 176, 0.20)', '#9c27b0'
        );
        registerZhongshuLayer(
            'xianduanZhongshu', xianduanZhongshuData,
            'rgba(255, 152, 0, 0.10)', '#ff9800', [6, 4]
        );

        // 2. 创建笔的折线系列
        const biSeries = chart.addLineSeries({
            color: 'rgba(41, 98, 255, 0.8)',
            lineWidth: 1,
            // title: '笔',
            lastValueVisible: false,
            priceLineVisible: false,
            lineStyle: 0, // 0=普通实线, 1=密集小圆点, 2=标准短虚线, 3=长虚线间隔较大, 4=稀疏点间隔很大
        });

        // 对笔数据进行排序，确保时间顺序正确（Lightweight Charts 要求严格的时间递增）
       biData.sort((a, b) => new Date(a.time) - new Date(b.time));
       biSeries.setData(biData);

        // 2.5 创建线段的折线系列（红色）
        const xdSeries = chart.addLineSeries({
            color: 'rgba(255, 0, 0, 0.7)',
            lineWidth: 2,
            // title: '线段',
            lastValueVisible: false,
            priceLineVisible: false,
            lineStyle: 2, // 实线
        });

        xdData.sort((a, b) => new Date(a.time) - new Date(b.time));
        xdSeries.setData(xdData);

        const layerConfigs = [
            { key: 'biZhongshu', label: '笔中枢', color: '#00acc1' },
            { key: 'zhongshuInXianduan', label: '笔中枢（线段内）', color: '#9c27b0' },
            { key: 'xianduanZhongshu', label: '线段中枢', color: '#ff9800' },
            { key: 'bi', label: '笔', color: '#2962ff' },
            { key: 'xd', label: '线段', color: '#ff0000' },
        ];
        const layerSeriesMap = {
            biZhongshu: primitiveLayerMap.biZhongshu,
            zhongshuInXianduan: primitiveLayerMap.zhongshuInXianduan,
            xianduanZhongshu: primitiveLayerMap.xianduanZhongshu,
            bi: {
                applyOptions: ({ visible }) => biSeries.applyOptions({ visible }),
            },
            xd: {
                applyOptions: ({ visible }) => xdSeries.applyOptions({ visible }),
            },
        };
        setupIndicatorGroup({
            triggerId: 'layerTrigger',
            dropdownId: 'layerDropdown',
            itemsId: 'layerItems',
            selectAllId: 'layerSelectAll',
            data: layerConfigs,
            seriesMap: layerSeriesMap,
            prefix: 'layer:',
        });

        // ========== 通用: 指标线渲染 + 下拉显隐联动 (均线/布林/RSI 复用) ==========
        // 创建折线序列并填充数据, 返回 key -> series 映射
        function buildOverlaySeries(data, opts) {
            opts = opts || {};
            const map = {};
            data.forEach(item => {
                const series = chart.addLineSeries(Object.assign({
                    color: item.color,
                    lineWidth: 1,
                    lastValueVisible: true,
                    priceLineVisible: false,
                    lineStyle: 0,
                    crosshairMarkerVisible: true,
                }, opts));
                series.setData(item.values);
                map[item.key] = series;
            });
            return map;
        }

        const maSeriesMap = buildOverlaySeries(maData);

        // 通用下拉控件: 点击触发器仅展开/收起(不改变显隐); 复选框控制单条显隐; 全选联动
        function setupIndicatorGroup(cfg) {
            const trigger = document.getElementById(cfg.triggerId);
            const dropdown = document.getElementById(cfg.dropdownId);
            const itemsContainer = document.getElementById(cfg.itemsId);
            const selectAll = document.getElementById(cfg.selectAllId);

            trigger.addEventListener('click', (e) => {
                if (e.target === trigger || e.target.nodeType === 3) {
                    dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
                }
            });
            document.addEventListener('click', (e) => {
                if (!trigger.contains(e.target)) dropdown.style.display = 'none';
            });

            const boxes = () => itemsContainer.querySelectorAll('input[type=checkbox]');
            const syncSelectAll = () => {
                const list = Array.from(boxes());
                selectAll.checked = list.length > 0 && list.every(b => b.checked);
            };

            cfg.data.forEach(item => {
                const visible = lsGetBool(cfg.prefix + item.key, true);
                const lbl = document.createElement('label');
                lbl.style.cssText = 'display:block;font-size:13px;padding:2px 0;cursor:pointer;';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = visible;
                cb.dataset.key = String(item.key);
                cb.style.cssText = 'margin-right:6px;cursor:pointer;';
                const dot = document.createElement('span');
                dot.style.cssText = "display:inline-block;width:10px;height:10px;border-radius:50%;background:" + item.color + ";margin-right:6px;vertical-align:middle;";
                lbl.appendChild(cb);
                lbl.appendChild(dot);
                lbl.appendChild(document.createTextNode(item.label));
                itemsContainer.appendChild(lbl);
                cfg.seriesMap[item.key].applyOptions({ visible });

                cb.addEventListener('change', () => {
                    lsSetBool(cfg.prefix + item.key, cb.checked);
                    cfg.seriesMap[item.key].applyOptions({ visible: cb.checked });
                    syncSelectAll();
                });
            });

            selectAll.addEventListener('change', () => {
                boxes().forEach(b => {
                    b.checked = selectAll.checked;
                    lsSetBool(cfg.prefix + b.dataset.key, selectAll.checked);
                    cfg.seriesMap[b.dataset.key].applyOptions({ visible: selectAll.checked });
                });
            });

            syncSelectAll();
        }

        setupIndicatorGroup({ triggerId: 'maTrigger', dropdownId: 'maDropdown', itemsId: 'maItems', selectAllId: 'maSelectAll', data: maData, seriesMap: maSeriesMap, prefix: 'ma:' });


        // 3. 创建三个可切换指标面板(成交量/BOLL/RSI), 每个面板左上角有下拉框选择当前指标,
        //    下拉框收起时显示当前指标名(同花顺风格), 选择状态持久化到 localStorage.
        const PRICE_SCALE_WIDTH = 70;  // 统一右侧价格刻度宽度, 保证各面板绘图区等宽、垂直对齐
        // 主图右侧价格刻度也设为相同宽度, 保证主图与各副图绘图区等宽、横向严格对齐(否则副图会整体左移)
        chart.priceScale('right').applyOptions({ minimumWidth: PRICE_SCALE_WIDTH });

        // 时间 -> 数值 查找表(用于跨面板十字光标定位)
        const volumeLookup = {};
        volumeData.forEach(v => { volumeLookup[v.time] = v.value; });
        const volumeColorLookup = {};
        volumeData.forEach(v => { volumeColorLookup[v.time] = v.color; });
        const bollLookup = {};
        candleData.forEach(v => { bollLookup[v.time] = v.close; });
        const rsiLookup = {};
        (rsiData[0] || { values: [] }).values.forEach(v => { rsiLookup[v.time] = v.value; });
        const macdLookup = {};
        const macdStatLookup = {};
        (macdData.stats || []).forEach(s => { macdLookup[s.time] = s.macd; macdStatLookup[s.time] = s; });

        // 将指标序列对齐到完整 K 线时间轴(热身期补空白点), 使子图逻辑索引与主图严格一致,
        // 杜绝副图整体偏移(如 RSI 偏左一个交易日).
        function alignToCandles(values) {
            const map = {};
            values.forEach(v => { map[v.time] = v.value; });
            return candleData.map(c => (c.time in map ? { time: c.time, value: map[c.time] } : { time: c.time }));
        }

        // 创建指标子图(配置与主图一致: 统一 barSpacing/rightOffset/价格刻度宽度;
        // 开启水平十字线, 悬停副图时显示水平影线)
        function createSubChart(container, height) {
            return LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: height,
                layout: { background: { color: '#ffffff' }, textColor: '#333' },
                grid: { vertLines: { visible: false }, horzLines: { visible: false } },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: { width: 1, color: '#758694', style: 2 },
                    horzLine: { width: 1, color: '#758694', style: 2 },
                },
                timeScale: {
                    visible: true, timeVisible: true,
                    rightOffset: 0, barSpacing: 4, minBarSpacing: 0.2,
                    fixLeftEdge: false, fixRightEdge: false,
                    ticksVisible: false, borderVisible: false,
                },
                rightPriceScale: { visible: true, autoScale: true, minimumWidth: PRICE_SCALE_WIDTH },
                leftPriceScale: { visible: false },
                handleScroll: { vertTouchDrag: false },
                localization: { timeFormatter: (time) => formatDateTime(time) },
            });
        }

        // 在子图上渲染多条折线(数据已对齐到 K 线时间轴), 返回 key->series
        function buildSubSeries(subChart, data) {
            const map = {};
            data.forEach(item => {
                const s = subChart.addLineSeries({
                    color: item.color, lineWidth: 1,
                    lastValueVisible: false, priceLineVisible: false,
                    crosshairMarkerVisible: true,
                });
                s.setData(alignToCandles(item.values));
                map[item.key] = s;
            });
            return map;
        }

        // 指标注册表
        const INDICATOR_LABEL = { volume: '成交量', boll: 'BOLL(26,2)', rsi: 'RSI(6,12,24)' };
        const INDICATOR_HEIGHT = { volume: 120, boll: 120, rsi: 120 };
        const INDICATOR_KEYS = ['volume', 'boll', 'rsi', 'macd'];
        const DEFAULT_PANELS = ['volume', 'boll', 'rsi', 'macd'];
        INDICATOR_LABEL.macd = 'MACD(10,21,7)';
        INDICATOR_HEIGHT.macd = 180;
        const panels = [];  // 各面板运行时状态

        // 在指定面板上(重新)构建某指标的系列; 切换指标时先移除旧系列(含依附其上的价格线)
        function buildIndicator(meta, indicator) {
            const { chart, container, valueLabel } = meta;
            meta.addedSeries.forEach(s => { try { chart.removeSeries(s); } catch (e) {} });
            meta.addedSeries = [];
            meta.primarySeries = null;
            meta.lookup = {};
            meta.labelRenderer = null;
            valueLabel.style.display = 'none';

            const h = INDICATOR_HEIGHT[indicator] || 120;
            chart.applyOptions({ height: h });
            container.style.height = h + 'px';

            if (indicator === 'volume') {
                const s = chart.addHistogramSeries({
                    color: '#26a69a', priceFormat: { type: 'volume' },
                    lastValueVisible: false, priceLineVisible: false,
                });
                s.setData(volumeData);
                meta.addedSeries.push(s);
                meta.primarySeries = s;
                meta.lookup = volumeLookup;
                meta.labelRenderer = (t) => {
                    const vl = meta.valueLabel;
                    if (!(t in volumeLookup)) { vl.style.display = 'none'; return; }
                    vl.innerHTML = '成交量: <span style="color:' + (volumeColorLookup[t] || '#333') + ';font-weight:bold">' + formatVolume(volumeLookup[t]) + '</span>';
                    vl.style.display = 'block';
                };
            } else if (indicator === 'boll') {
                const cs = chart.addCandlestickSeries({
                    upColor: 'rgba(239, 83, 80, 0.5)', downColor: 'rgba(38, 166, 154, 0.5)',
                    borderVisible: false, wickUpColor: 'rgba(239, 83, 80, 0.5)', wickDownColor: 'rgba(38, 166, 154, 0.5)',
                    lastValueVisible: false, priceLineVisible: false,
                });
                cs.setData(candleData);
                meta.addedSeries.push(cs);
                meta.primarySeries = cs;
                meta.lookup = bollLookup;
                const lines = buildSubSeries(chart, bollData);
                Object.keys(lines).forEach(k => meta.addedSeries.push(lines[k]));
                const _bollMaps = {};
                (bollData || []).forEach(it => { const m = {}; (it.values || []).forEach(v => m[v.time] = v.value); _bollMaps[it.key] = m; });
                meta.labelRenderer = (t) => {
                    const vl = meta.valueLabel;
                    const upM = _bollMaps['BOLL_UP'], dnM = _bollMaps['BOLL_DOWN'];
                    if (!upM || !dnM || !(t in upM) || !(t in dnM)) { vl.style.display = 'none'; return; }
                    const bands = (bollData || []).map(it => { const m = _bollMaps[it.key]; return (m && (t in m)) ? '<span style="color:' + it.color + ';font-weight:bold">' + it.key.replace('BOLL_', '') + ':' + m[t].toFixed(currentPrecision) + '</span>' : null; }).filter(Boolean);
                    const width = upM[t] - dnM[t];
                    vl.innerHTML = (bands.length ? bands.join('  ') + '  ' : '') + '<span style="color:#666;font-weight:bold">通道宽:' + width.toFixed(currentPrecision) + '</span>';
                    vl.style.display = 'block';
                };
            } else if (indicator === 'rsi') {
                const lines = buildSubSeries(chart, rsiData);
                const firstKey = Object.keys(lines)[0];
                Object.keys(lines).forEach(k => meta.addedSeries.push(lines[k]));
                const first = lines[firstKey];
                if (first) {
                    first.createPriceLine({ price: 80, color: 'rgba(120,120,120,0.45)', lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '80' });
                    first.createPriceLine({ price: 50, color: 'rgba(120,120,120,0.35)', lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '50' });
                    first.createPriceLine({ price: 20, color: 'rgba(120,120,120,0.45)', lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '20' });
                }
                meta.primarySeries = first || null;
                meta.lookup = rsiLookup;
                const _rsiMaps = {};
                (rsiData || []).forEach(it => { const m = {}; (it.values || []).forEach(v => m[v.time] = v.value); _rsiMaps[it.key] = m; });
                meta.labelRenderer = (t) => {
                    const vl = meta.valueLabel;
                    const parts = (rsiData || []).map(it => { const m = _rsiMaps[it.key]; return (m && (t in m)) ? '<span style="color:' + it.color + ';font-weight:bold">' + it.key + ':' + m[t].toFixed(currentPrecision) + '</span>' : null; }).filter(Boolean);
                    if (!parts.length) { vl.style.display = 'none'; return; }
                    vl.innerHTML = parts.join('  ');
                    vl.style.display = 'block';
                };
            } else if (indicator === 'macd') {
                const _hist = chart.addHistogramSeries({ priceFormat: { type: 'price', precision: currentPrecision, minMove: 1 / Math.pow(10, currentPrecision) }, lastValueVisible: false, priceLineVisible: false });
                const _hmap = {};
                (macdData.stats || []).forEach(s => { _hmap[s.time] = { v: s.macd, c: s.color }; });
                _hist.setData(candleData.map(k => (k.time in _hmap ? { time: k.time, value: _hmap[k.time].v, color: _hmap[k.time].c } : { time: k.time, value: 0 })));
                meta.addedSeries.push(_hist);
                if ((macdData.markers || []).length) _hist.setMarkers(macdData.markers);
                chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.05, bottom: 0.05 } });
                const _mlines = buildSubSeries(chart, macdData.lines || []);
                Object.keys(_mlines).forEach(k => meta.addedSeries.push(_mlines[k]));
                // DIFF/DEA 线也挂同一 provider(见下方 _macdAsp), 与柱子共用同一价格范围。
                // 范围 = 可见(柱子+DIFF+DEA)极值并强制含0 → 线条始终完整可见, 不再被裁切。
                // 副图加高到180px 以补偿“含线条后柱子占比变小”的问题。
                meta.primarySeries = _hist;
                // ---- MACD 副图: autoscaleInfoProvider(序列级) 范围 = 可见(柱子+DIFF+DEA)极值, 强制含 0 ----
                // v4.1.0 关键事实(已查 typings): IPriceScaleApi 只有 applyOptions/options/width, 无 setVisiblePriceRange(那是 v5)。
                //   autoscaleInfoProvider 是【序列选项】, 入参 () => AutoscaleInfo; autoScale 必须为 true 才会调用。
                // 反转根因: 库默认范围在“全正/全负”窗口不含 0 → 柱子翻转。这里强制 min≤0≤max 根除之。
                // 线条可见性: 把 DIFF/DEA 极值也纳入范围 → 线条完整显示; 含线条后柱子占比变小, 用 180px 副图补偿。
                const _lineMaps = {};
                (macdData.lines || []).forEach(function (ln) { const m = {}; (ln.values || []).forEach(v => { m[v.time] = v.value; }); _lineMaps[ln.key] = m; });
                function _macdAsp(base) {
                    // base 是【整条序列】的全局极值(库不按可见窗口算), 故忽略它, 自行按可见逻辑范围统计。
                    var lo = 0, hi = 0, have = false;
                    try {
                        var lr = chart.timeScale().getVisibleLogicalRange();
                        if (lr) {
                            var iFrom = Math.max(0, Math.ceil(lr.from));
                            var iTo = Math.min(candleData.length - 1, Math.floor(lr.to));
                            var mn = Infinity, mx = -Infinity;
                            for (var i = iFrom; i <= iTo; i++) {
                                var t = candleData[i].time;
                                var hv = _hmap[t];
                                if (hv) { if (hv.v < mn) mn = hv.v; if (hv.v > mx) mx = hv.v; }
                                Object.keys(_lineMaps).forEach(function (k) { var v = _lineMaps[k][t]; if (typeof v === 'number') { if (v < mn) mn = v; if (v > mx) mx = v; } });
                            }
                            if (isFinite(mn) && isFinite(mx)) { lo = mn; hi = mx; have = true; }
                        }
                    } catch (e) {}
                    if (!have) { try { var b = (typeof base === 'function') ? base() : base; if (b && typeof b.priceRange === 'object' && b.priceRange) { lo = b.priceRange.minValue; hi = b.priceRange.maxValue; } else if (b && typeof b.minValue === 'number') { lo = b.minValue; hi = b.maxValue; } } catch (e2) {} }
                    if (lo > 0) lo = 0; if (hi < 0) hi = 0;   // 强制含 0 → 杜绝放大反转
                    if (hi - lo < 1e-9) hi = lo + 0.01;
                    return { priceRange: { minValue: lo, maxValue: hi }, margins: { above: 0, below: 0 } };
                }
                _hist.applyOptions({ autoscaleInfoProvider: _macdAsp });
                Object.keys(_mlines).forEach(function (k) { try { _mlines[k].applyOptions({ autoscaleInfoProvider: _macdAsp }); } catch (e) {} });
                                meta.lookup = macdLookup;
                meta.labelRenderer = (t) => {
                    const s = macdStatLookup[t]; const vl = meta.valueLabel;
                    if (!s) { vl.style.display = 'none'; return; }
                    const sp = (txt, color) => '<span style="color:' + color + ';font-weight:bold">' + txt + '</span>';
                    const rg = (v) => v >= 0 ? '#ef5350' : '#26a69a';
                    vl.innerHTML = sp('MACD ' + s.macd.toFixed(currentPrecision), rg(s.macd))
                        + '  ' + sp('连增 ' + (s.lianzeng > 0 ? '+' : '') + s.lianzeng, rg(s.lianzeng))
                        + '  ' + sp((s.area >= 0 ? '红柱面积 ' : '绿柱面积 ') + Math.abs(s.area).toFixed(1) + '  平均 ' + Math.abs(s.avg).toFixed(1), rg(s.area))
                        + '  ' + sp('DIFF ' + s.dif.toFixed(currentPrecision), '#ff9800')
                        + '  ' + sp('DEA ' + s.dea.toFixed(currentPrecision), '#5b9bd5');
                    vl.style.display = 'block';
                };
            }

            meta.indicator = indicator;
            chart.priceScale('right').applyOptions({ minimumWidth: PRICE_SCALE_WIDTH });

            // 与主图可见范围保持一致
            const lr = chart.timeScale().getVisibleLogicalRange();
            if (lr) meta.chart.timeScale().setVisibleLogicalRange(lr);
            else meta.chart.timeScale().fitContent();
        }

        // 初始化一个面板: 创建图表实例、填充下拉选项、绑定切换事件、构建初始指标
        function setupPanel(idx) {
            const container = document.getElementById('panel' + idx);
            const select = document.getElementById('panelSelect' + idx);
            const valueLabel = document.getElementById('panelValue' + idx);
            const subChart = createSubChart(container, INDICATOR_HEIGHT.volume);

            const meta = { idx, container, select, valueLabel, chart: subChart, indicator: null, addedSeries: [], primarySeries: null, lookup: {} };

            INDICATOR_KEYS.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = INDICATOR_LABEL[key];
                select.appendChild(opt);
            });

            let initKey = lsGetString('panel:' + idx, DEFAULT_PANELS[idx] || 'volume');
            if (!INDICATOR_LABEL[initKey]) initKey = DEFAULT_PANELS[idx] || 'volume';
            select.value = initKey;

            select.addEventListener('change', () => {
                lsSetString('panel:' + idx, select.value);
                buildIndicator(meta, select.value);
            });

            buildIndicator(meta, initKey);
            panels.push(meta);
            return meta;
        }

        for (let i = 0; i < 4; i++) setupPanel(i);







        // ========== 时间轴/滚动同步 (主图 ↔ 三个面板) ==========
        const subChartList = panels.map(p => p.chart);
        let isSyncingTimeRange = false;

        function applyLogicalRange(logicalRange, source) {
            if (isSyncingTimeRange || !logicalRange) return;
            isSyncingTimeRange = true;
            if (source !== chart) chart.timeScale().setVisibleLogicalRange(logicalRange);
            subChartList.filter(c => c !== source).forEach(c => c.timeScale().setVisibleLogicalRange(logicalRange));
            isSyncingTimeRange = false;
        }

        chart.timeScale().subscribeVisibleLogicalRangeChange((lr) => applyLogicalRange(lr, chart));
        subChartList.forEach(sub => sub.timeScale().subscribeVisibleLogicalRangeChange((lr) => applyLogicalRange(lr, sub)));

        chart.timeScale().fitContent();
        subChartList.forEach(sub => sub.timeScale().fitContent());

        // 响应式宽度
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth });
            panels.forEach(p => p.chart.applyOptions({ width: p.container.clientWidth }));
        });

        // ========== 跨面板十字光标同步(垂直贯穿 + 各副图水平影线) ==========
        let isSyncingCrosshair = false;

        // 同步除触发源外所有面板的十字光标, 并更新成交量数值标签
        function syncSubCrosshairs(time, exceptMeta) {
            panels.forEach(p => {
                if (p === exceptMeta) return;
                if (time && (time in p.lookup) && p.primarySeries) {
                    p.chart.setCrosshairPosition(p.lookup[time], time, p.primarySeries);
                    if (p.labelRenderer) p.labelRenderer(time);
                } else {
                    p.chart.clearCrosshairPosition();
                    p.valueLabel.style.display = 'none';
                }
            });
        }

        // 主图 -> 各面板
        chart.subscribeCrosshairMove((param) => {
            if (isSyncingCrosshair) return;
            isSyncingCrosshair = true;
            syncSubCrosshairs(param.time, null);
            updateTooltip(param, candlestickSeries);
            isSyncingCrosshair = false;
        });

        // 各面板 -> 主图 + 其他面板
        panels.forEach(p => {
            p.chart.subscribeCrosshairMove((param) => {
                if (isSyncingCrosshair) return;
                isSyncingCrosshair = true;
                if (param.time) {
                    const candleAt = candleData.find(d => d.time === param.time);
                    if (candleAt) chart.setCrosshairPosition(candleAt.close, param.time, candlestickSeries);
                    syncSubCrosshairs(param.time, p);
                    if (p.labelRenderer) p.labelRenderer(param.time);
                } else {
                    chart.clearCrosshairPosition();
                    syncSubCrosshairs(null, p);
                    p.valueLabel.style.display = 'none';
                }
                const mainParam = { ...param, seriesData: new Map([[candlestickSeries, candleData.find(d => d.time === param.time)]]) };
                updateTooltip(mainParam, candlestickSeries);
                isSyncingCrosshair = false;
            });
        });

        // Tooltip 更新函数
        function updateTooltip(param, series) {
            if (param.point === undefined || !param.time) {
                tooltip.style.display = 'none';
                return;
            }

            const data = param.seriesData.get(series);
            if (!data) {
                tooltip.style.display = 'none';
                return;
            }

            const isUp = data.close >= data.open;
            const open = data.open.toFixed(currentPrecision);
            const high = data.high.toFixed(currentPrecision);
            const low = data.low.toFixed(currentPrecision);
            const close = data.close.toFixed(currentPrecision);
            const priceClass = isUp ? 'up' : 'down';
            const arrow = isUp ? '↑' : '↓';

           tooltip.innerHTML = `
                    <div><span class="label">日期:</span><span class="value">${formatDateTime(param.time)}</span></div>
                    <div><span class="label">开盘:</span><span class="value ${priceClass}">${open}</span></div>
                    <div><span class="label">最高:</span><span class="value ${priceClass}">${high}</span></div>
                    <div><span class="label">最低:</span><span class="value ${priceClass}">${low}</span></div>
                    <div><span class="label">收盘:</span><span class="value ${priceClass}">${close} ${arrow}</span></div>
                `;

            const x = param.point.x + 15;
            const y = param.point.y + 15;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
            tooltip.style.display = 'block';
        }


        // 成交量数值格式化(亿/万)
        function formatVolume(volume) {
            if (volume >= 100000000) return (volume / 100000000).toFixed(2) + '亿';
            if (volume >= 10000) return (volume / 10000).toFixed(2) + '万';
            return volume.toLocaleString();
        }


        // ========== 方法1：使用标记（Markers）显示缺口 ==========

        // 存储缺口 markers，与高低价 markers 合并
        let gapMarkers = [];

        function displayGapsWithMarkers(gaps) {
            gapMarkers = gaps.map(gap => ({
                time: gap.trade_datetime,
                position: gap.position,
                color: gap.color,
                shape: gap.shape,
                text: gap.text
            }));
        }

        displayGapsWithMarkers(gapsData);

        // 缺口显示开关
        const showGapsToggle = document.getElementById('showGapsToggle');

        // 应用缺口开关初始状态(从 localStorage 读回)
        showGapsToggle.checked = lsGetBool('gaps:visible', true);
        showGapsToggle.addEventListener('change', () => {
            lsSetBool('gaps:visible', showGapsToggle.checked);
            updateHighLowMarkers();


        
        });


        // ========== 可见范围最高/最低价标注 ==========

        function updateHighLowMarkers() {
            const timeRange = chart.timeScale().getVisibleRange();
            if (!timeRange) return;

            // 筛选可见范围内的 K 线
            const visibleCandles = candleData.filter(d => d.time >= timeRange.from && d.time <= timeRange.to);
            if (visibleCandles.length === 0) return;

            // 找最高价和最低价
            let highCandle = visibleCandles[0];
            let lowCandle = visibleCandles[0];
            for (const c of visibleCandles) {
                if (c.high > highCandle.high) highCandle = c;
                if (c.low < lowCandle.low) lowCandle = c;
            }

            const hlMarkers = [
                {
                    time: highCandle.time,
                    position: 'aboveBar',
                    color: '#ef5350',
                    shape: 'arrowDown',
                    text: 'H ' + highCandle.high.toFixed(currentPrecision),
                },
                {
                    time: lowCandle.time,
                    position: 'belowBar',
                    color: '#26a69a',
                    shape: 'arrowUp',
                    text: 'L ' + lowCandle.low.toFixed(currentPrecision),
                },
            ];

            // 合并缺口 markers 和高低价 markers（受开关控制），按时间排序
            const activeGapMarkers = showGapsToggle && showGapsToggle.checked ? gapMarkers : [];
            const allMarkers = [...activeGapMarkers, ...hlMarkers].sort((a, b) => {
                if (a.time < b.time) return -1;
                if (a.time > b.time) return 1;
                return 0;
            });
            candlestickSeries.setMarkers(allMarkers);
        }

        // 监听可见范围变化，更新高低价标注
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
            updateHighLowMarkers();
        });

        // 初始标注
        updateHighLowMarkers();


    }
</script>

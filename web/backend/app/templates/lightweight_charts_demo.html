<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Charts Demo</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        #chart {
            width: 100%;
            height: 600px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .volume-container {
            width: 100%;
            height: 150px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
            position: relative;
        }

        .indicator-container {
            width: 100%;
            height: 120px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
            position: relative;
        }

        .info h3 {
            margin-top: 0;
            color: #333;
        }

        .info p {
            color: #666;
            line-height: 1.6;
        }

        .ohlc-tooltip {
            position: absolute;
            display: none;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .ohlc-tooltip .label {
            color: #aaa;
        }

        .ohlc-tooltip .value {
            font-weight: bold;
            margin-left: 5px;
        }

        .ohlc-tooltip .up {
            color: #ef5350;
        }

        .ohlc-tooltip .down {
            color: #26a69a;
        }

        .volume-label {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

    </style>
</head>
<body>

<script>
    // 智能日期格式化：只有年月日则显示 YYYY-MM-DD，带时分则显示 YYYY-MM-DD HH:MM
    function formatDateTime(time) {
        let date;
        if (typeof time === 'number') {
            date = new Date(time * 1000);
        } else if (typeof time === 'string') {
            date = new Date(time);
        } else {
            return String(time);
        }
        const pad = (n) => String(n).padStart(2, '0');
        const datePart = `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())}`;
        const hours = date.getUTCHours();
        const minutes = date.getUTCMinutes();
        if (hours === 0 && minutes === 0) {
            return datePart;
        }
        return `${datePart} ${pad(hours)}:${pad(minutes)}`;
    }
</script>
<div class="container">
    <h1>📊 Lightweight Charts 简单示例</h1>

    <div style="margin-bottom:10px;display:flex;align-items:center;gap:16px;">
        <label style="font-size:14px;cursor:pointer;user-select:none;">
            <input type="checkbox" id="showGapsToggle" checked style="margin-right:4px;cursor:pointer;">显示缺口
        </label>
        <div id="maTrigger" style="font-size:14px;user-select:none;position:relative;cursor:pointer;padding:2px 6px;">均线 ▾
            <div id="maDropdown" style="display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid #ddd;border-radius:4px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:2000;min-width:140px;">
                <label style="display:block;font-size:13px;padding:2px 0;border-bottom:1px solid #eee;margin-bottom:4px;cursor:pointer;">
                    <input type="checkbox" id="maSelectAll" checked style="margin-right:6px;cursor:pointer;">全选
                </label>
                <div id="maItems"></div>
            </div>
        </div>
    </div>

    <div id="chart">
        <div class="ohlc-tooltip" id="ohlcTooltip"></div>
    </div>
    <div id="volume-chart" class="volume-container">
        <div class="volume-label" id="volumeLabel">成交量: --</div>
    </div>
    <div id="boll-chart" class="indicator-container">
        <div class="volume-label" style="display:block;">BOLL(26,2)</div>
    </div>
    <div id="rsi-chart" class="indicator-container">
        <div class="volume-label" style="display:block;">RSI(6,12,24)</div>
    </div>
</div>

<script>
    // localStorage 持久化辅助(必须放在所有使用者之前, 否则触发 TDZ ReferenceError)
    const lsGetBool = (k, def) => {
        const v = localStorage.getItem(k);
        return v === null ? def : v === '1';
    };
    const lsSetBool = (k, v) => localStorage.setItem(k, v ? '1' : '0');

    // 从后端传入的数据
    const candleData = {{ candle_data | safe }};
    const biData = {{ bi_data | safe }};
    const xdData = {{ xd_data | safe }};
    const gapsData = {{ gaps_data | safe }};
    const volumeData = {{ volume_data | safe }};
        const maData = {{ ma_data | safe }};      // 后端计算的 MA 列表:   [{key, label, color, values:[{time,value}]}]
        const bollData = {{ boll_data | safe }};  // 后端计算的 BOLL 列表: [{key, label, color, values:[{time,value}]}]
        const rsiData = {{ rsi_data | safe }};    // 后端计算的 RSI 列表:  [{key, label, color, values:[{time,value}]}]
    const currentPrecision = {{ precision }};  // 当前精度

    console.log('收到的K线数据:', candleData.length);
    console.log('收到的笔数据:', biData.length);
    console.log('收到的线段数据:', xdData.length);
    console.log('收到的缺口数据:', gapsData.length);
    console.log('收到的成交量数据:', volumeData.length);
    console.log('当前精度:', currentPrecision);


    if (!candleData || !Array.isArray(candleData) || candleData.length === 0) {
        document.getElementById('chart').innerHTML = '<p style="color:red;text-align:center;padding-top:250px;">数据加载失败</p>';
    } else {
        const chartContainer = document.getElementById('chart');
        const volumeContainer = document.getElementById('volume-chart');
        const tooltip = document.getElementById('ohlcTooltip');
        const volumeLabel = document.getElementById('volumeLabel');

        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: 600,
            layout: {
                background: {color: '#ffffff'},
                textColor: '#333',
            },
            grid: {
                vertLines: {color: '#e0e0e0'},
                horzLines: {color: '#e0e0e0'},
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: {
                    width: 1,
                    color: '#758694',
                    style: 2, // 虚线
                },
                horzLine: {
                    width: 1,
                    color: '#758694',
                    style: 2, // 虚线
                },
            },
            timeScale: { // 调整缩放时显示的k线数量，下方还有一个关于成交量缩放的部分也要修改
                timeVisible: true,
                rightOffset: 12,
                barSpacing: 4,        // K线间距,增大此值会让K线显示更稀疏
                minBarSpacing: 0.2,    // 最小K线间距,减小此值允许更多K线同时显示
                fixLeftEdge: false,    // 不固定左边缘,允许滚动查看更多历史数据
                fixRightEdge: false,   // 不固定右边缘
            },
            rightPriceScale: {
                visible: true,
                autoScale: true,
            },
            leftPriceScale: {
                visible: false,
            },
            localization: {
                timeFormatter: (time) => formatDateTime(time),
            },
        });

        // 1. 创建K线系列
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#ef5350',
            downColor: '#26a69a',
            borderVisible: false,
            wickUpColor: '#ef5350',
            wickDownColor: '#26a69a',
        });
        candlestickSeries.setData(candleData);

        // 2. 创建笔的折线系列
        const biSeries = chart.addLineSeries({
            color: 'rgba(41, 98, 255, 0.8)',
            lineWidth: 1,
            // title: '笔',
            lastValueVisible: false,
            priceLineVisible: false,
            lineStyle: 0, // 0=普通实线, 1=密集小圆点, 2=标准短虚线, 3=长虚线间隔较大, 4=稀疏点间隔很大
        });

        // 对笔数据进行排序，确保时间顺序正确（Lightweight Charts 要求严格的时间递增）
       biData.sort((a, b) => new Date(a.time) - new Date(b.time));
       biSeries.setData(biData);

        // 2.5 创建线段的折线系列（红色）
        const xdSeries = chart.addLineSeries({
            color: 'rgba(255, 0, 0, 0.7)',
            lineWidth: 2,
            // title: '线段',
            lastValueVisible: false,
            priceLineVisible: false,
            lineStyle: 2, // 实线
        });

        xdData.sort((a, b) => new Date(a.time) - new Date(b.time));
        xdSeries.setData(xdData);

        // ========== 通用: 指标线渲染 + 下拉显隐联动 (均线/布林/RSI 复用) ==========
        // 创建折线序列并填充数据, 返回 key -> series 映射
        function buildOverlaySeries(data, opts) {
            opts = opts || {};
            const map = {};
            data.forEach(item => {
                const series = chart.addLineSeries(Object.assign({
                    color: item.color,
                    lineWidth: 1,
                    lastValueVisible: true,
                    priceLineVisible: false,
                    lineStyle: 0,
                    crosshairMarkerVisible: true,
                }, opts));
                series.setData(item.values);
                map[item.key] = series;
            });
            return map;
        }

        const maSeriesMap = buildOverlaySeries(maData);

        // 通用下拉控件: 点击触发器仅展开/收起(不改变显隐); 复选框控制单条显隐; 全选联动
        function setupIndicatorGroup(cfg) {
            const trigger = document.getElementById(cfg.triggerId);
            const dropdown = document.getElementById(cfg.dropdownId);
            const itemsContainer = document.getElementById(cfg.itemsId);
            const selectAll = document.getElementById(cfg.selectAllId);

            trigger.addEventListener('click', (e) => {
                if (e.target === trigger || e.target.nodeType === 3) {
                    dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
                }
            });
            document.addEventListener('click', (e) => {
                if (!trigger.contains(e.target)) dropdown.style.display = 'none';
            });

            const boxes = () => itemsContainer.querySelectorAll('input[type=checkbox]');
            const syncSelectAll = () => {
                const list = Array.from(boxes());
                selectAll.checked = list.length > 0 && list.every(b => b.checked);
            };

            cfg.data.forEach(item => {
                const visible = lsGetBool(cfg.prefix + item.key, true);
                const lbl = document.createElement('label');
                lbl.style.cssText = 'display:block;font-size:13px;padding:2px 0;cursor:pointer;';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = visible;
                cb.dataset.key = String(item.key);
                cb.style.cssText = 'margin-right:6px;cursor:pointer;';
                const dot = document.createElement('span');
                dot.style.cssText = "display:inline-block;width:10px;height:10px;border-radius:50%;background:" + item.color + ";margin-right:6px;vertical-align:middle;";
                lbl.appendChild(cb);
                lbl.appendChild(dot);
                lbl.appendChild(document.createTextNode(item.label));
                itemsContainer.appendChild(lbl);
                cfg.seriesMap[item.key].applyOptions({ visible });

                cb.addEventListener('change', () => {
                    lsSetBool(cfg.prefix + item.key, cb.checked);
                    cfg.seriesMap[item.key].applyOptions({ visible: cb.checked });
                    syncSelectAll();
                });
            });

            selectAll.addEventListener('change', () => {
                boxes().forEach(b => {
                    b.checked = selectAll.checked;
                    lsSetBool(cfg.prefix + b.dataset.key, selectAll.checked);
                    cfg.seriesMap[b.dataset.key].applyOptions({ visible: selectAll.checked });
                });
            });

            syncSelectAll();
        }

        setupIndicatorGroup({ triggerId: 'maTrigger', dropdownId: 'maDropdown', itemsId: 'maItems', selectAllId: 'maSelectAll', data: maData, seriesMap: maSeriesMap, prefix: 'ma:' });

        // 3.创建成交量图表
        const volumeChart = LightweightCharts.createChart(volumeContainer, {
            width: volumeContainer.clientWidth,
            height: 150,
            layout: {
                background: {color: '#ffffff'},
                textColor: '#333',
            },
            grid: {
                vertLines: {visible: false},
                horzLines: {visible: false},
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: {
                    width: 1,
                    color: '#758694',
                    style: 2, // 虚线
                },
                horzLine: {
                    visible: false, // 隐藏水平线
                },
            },
            timeScale: {
                visible: true,
                timeVisible: true,
                rightOffset: 12,        // 与主图表保持一致
                barSpacing: 4,          // K线间距,与主图表保持一致
                minBarSpacing: 0.2,     // 最小K线间距,与主图表保持一致
                fixLeftEdge: false,     // 不固定左边缘
                fixRightEdge: false,    // 不固定右边缘
            },
            rightPriceScale: {
                visible: true, // 显示右侧价格刻度，保持与主图表一致
                autoScale: true,
            },
            leftPriceScale: {
                visible: false,
            },
            handleScroll: {
                vertTouchDrag: false, // 禁止垂直拖动
            },
            localization: {
                timeFormatter: (time) => formatDateTime(time),
            },
        });

        // 创建成交量系列
        const volumeSeries = volumeChart.addHistogramSeries({
            color: '#26a69a',
            priceFormat: { type: 'volume' },
            lastValueVisible: false,
            priceLineVisible: false,
        });

        volumeSeries.setData(volumeData);

        // ========== 指标子图(布林/RSI) —— 独立面板, 位于成交量下方 ==========
        function createSubChart(container) {
            return LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 120,
                layout: { background: { color: '#ffffff' }, textColor: '#333' },
                grid: { vertLines: { visible: false }, horzLines: { visible: false } },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: { width: 1, color: '#758694', style: 2 },
                    horzLine: { visible: false },
                },
                timeScale: {
                    visible: true, timeVisible: true,
                    rightOffset: 12, barSpacing: 4, minBarSpacing: 0.2,
                    fixLeftEdge: false, fixRightEdge: false,
                    ticksVisible: false,
                    borderVisible: false,
                },
                rightPriceScale: { visible: true, autoScale: true, minimumWidth: 200 },
                leftPriceScale: { visible: false },
                handleScroll: { vertTouchDrag: false },
                localization: { timeFormatter: (time) => formatDateTime(time) },
            });
        }

        // 在子图上渲染多条折线, 返回 key -> series
        function buildSubSeries(subChart, data) {
            // 对齐逻辑索引: 指标数据常因热身期(RSI 的 diff、BOLL 的滚动窗口)产生前导
            // NaN 被丢弃, 导致子图第一根数据点晚于主图 K 线. lightweight-charts 按各图
            // 自身数据顺序分配逻辑索引, 起点错位会使同步可见范围时整体偏移(如 RSI 偏左 1 根).
            // 在首根 K 线时间补一个空白点(无 value), 让逻辑索引 0 与主图严格对齐.
            const firstTime = candleData.length ? candleData[0].time : null;
            const map = {};
            data.forEach(item => {
                let values = item.values;
                if (firstTime && (values.length === 0 || values[0].time !== firstTime)) {
                    values = [{ time: firstTime }, ...values];
                }
                const s = subChart.addLineSeries({
                    color: item.color, lineWidth: 1,
                    lastValueVisible: false, priceLineVisible: false,
                    crosshairMarkerVisible: true,
                });
                s.setData(values);
                map[item.key] = s;
            });
            return map;
        }

        // 布林子图: 中间叠加一份 K 线(与主图同数据), 外加 BOLL 三条线
        const bollContainer = document.getElementById('boll-chart');
        const bollChart = createSubChart(bollContainer);
        const bollCandleSeries = bollChart.addCandlestickSeries({
            upColor: 'rgba(239, 83, 80, 0.5)',
            downColor: 'rgba(38, 166, 154, 0.5)',
            borderVisible: false,
            wickUpColor: 'rgba(239, 83, 80, 0.5)',
            wickDownColor: 'rgba(38, 166, 154, 0.5)',
            lastValueVisible: false,
            priceLineVisible: false,
        });
        bollCandleSeries.setData(candleData);
        const bollSeriesMap = buildSubSeries(bollChart, bollData);

        // RSI 子图 + 20/50/80 参考线
        const rsiContainer = document.getElementById('rsi-chart');
        const rsiChart = createSubChart(rsiContainer);
        const rsiSeriesMap = buildSubSeries(rsiChart, rsiData);
        const rsiRef = rsiSeriesMap[Object.keys(rsiSeriesMap)[0]];
        if (rsiRef) {
            rsiRef.createPriceLine({ price: 80, color: 'rgba(120,120,120,0.45)', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '80' });
            rsiRef.createPriceLine({ price: 50, color: 'rgba(120,120,120,0.35)', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '50' });
            rsiRef.createPriceLine({ price: 20, color: 'rgba(120,120,120,0.45)', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '20' });
        }

        // ========== 统一右侧价格刻度宽度, 保证各子图绘图区域等宽(垂直对齐) ==========
        // 不同面板的价格量级不同(股价/成交量/0-100), 默认刻度宽度不一,
        // 会导致绘图区域宽度不同, 同一 K 线在各面板的 x 坐标错位.
        // 统一右侧价格刻度宽度, 保证各子图绘图区域等宽(垂直对齐).
        // minimumWidth 是下限, 必须大于任一图表的自然刻度宽度,
        // 否则自然更宽的图表(如主图股价)仍会不一致 -> BOLL/RSI 与 K 线错位.
        const PRICE_SCALE_WIDTH = 200;
        [chart, volumeChart, bollChart, rsiChart].forEach(c =>
            c.priceScale('right').applyOptions({ minimumWidth: PRICE_SCALE_WIDTH })
        );

        // ========== 时间轴/滚动同步 (主图 ↔ 成交量/布林/RSI 子图) ==========
        const subCharts = [volumeChart, bollChart, rsiChart];
        let isSyncingTimeRange = false;

        function applyLogicalRange(logicalRange, source) {
            if (isSyncingTimeRange || !logicalRange) return;
            isSyncingTimeRange = true;
            if (source !== chart) chart.timeScale().setVisibleLogicalRange(logicalRange);
            subCharts.filter(c => c !== source).forEach(c => c.timeScale().setVisibleLogicalRange(logicalRange));
            isSyncingTimeRange = false;
        }

        chart.timeScale().subscribeVisibleLogicalRangeChange((lr) => applyLogicalRange(lr, chart));
        subCharts.forEach(sub => sub.timeScale().subscribeVisibleLogicalRangeChange((lr) => applyLogicalRange(lr, sub)));

        chart.timeScale().fitContent();
        subCharts.forEach(sub => sub.timeScale().fitContent());

        // 响应式调整
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth });
            volumeChart.applyOptions({ width: volumeContainer.clientWidth });
            bollChart.applyOptions({ width: bollContainer.clientWidth });
            rsiChart.applyOptions({ width: rsiContainer.clientWidth });
        });

        // ========== 跨图表十字光标同步 ==========
        let isSyncingCrosshair = false;

        // time -> price 查找表(用于 setCrosshairPosition)
        const volumeLookup = {};
        volumeData.forEach(v => { volumeLookup[v.time] = v.value; });
        const bollLookup = {};
        candleData.forEach(v => { bollLookup[v.time] = v.close; });
        const rsiLookup = {};
        (rsiData[0] || { values: [] }).values.forEach(v => { rsiLookup[v.time] = v.value; });

        const subChartMeta = [
            { chart: volumeChart, lookup: volumeLookup, series: volumeSeries, label: volumeLabel, updater: updateVolumeLabel },
            { chart: bollChart, lookup: bollLookup, series: bollCandleSeries },
            { chart: rsiChart, lookup: rsiLookup, series: rsiSeriesMap[Object.keys(rsiSeriesMap)[0]] },
        ];

        // 同步所有子图十字光标(可排除触发源)
        function syncAllSubCrosshairs(time, except) {
            subChartMeta.filter(m => m !== except).forEach(meta => {
                if (time && time in meta.lookup) {
                    meta.chart.setCrosshairPosition(meta.lookup[time], time, meta.series);
                    if (meta.label && meta.updater) meta.updater(meta.lookup[time]);
                } else {
                    meta.chart.clearCrosshairPosition();
                    if (meta.label) meta.label.style.display = 'none';
                }
            });
        }

        // 主图 -> 子图
        chart.subscribeCrosshairMove((param) => {
            if (isSyncingCrosshair) return;
            isSyncingCrosshair = true;
            syncAllSubCrosshairs(param.time, null);
            updateTooltip(param, candlestickSeries);
            isSyncingCrosshair = false;
        });

        // 各子图 -> 主图 + 其他子图
        subChartMeta.forEach(meta => {
            meta.chart.subscribeCrosshairMove((param) => {
                if (isSyncingCrosshair) return;
                isSyncingCrosshair = true;
                if (param.time) {
                    const candleAt = candleData.find(d => d.time === param.time);
                    if (candleAt) chart.setCrosshairPosition(candleAt.close, param.time, candlestickSeries);
                    syncAllSubCrosshairs(param.time, meta);
                    if (param.time in meta.lookup && meta.label && meta.updater) meta.updater(meta.lookup[param.time]);
                } else {
                    chart.clearCrosshairPosition();
                    syncAllSubCrosshairs(null, meta);
                    if (meta.label) meta.label.style.display = 'none';
                }
                const mainParam = { ...param, seriesData: new Map([[candlestickSeries, candleData.find(d => d.time === param.time)]]) };
                updateTooltip(mainParam, candlestickSeries);
                isSyncingCrosshair = false;
            });
        });

        // Tooltip 更新函数
        function updateTooltip(param, series) {
            if (param.point === undefined || !param.time) {
                tooltip.style.display = 'none';
                return;
            }

            const data = param.seriesData.get(series);
            if (!data) {
                tooltip.style.display = 'none';
                return;
            }

            const open = data.open.toFixed(currentPrecision);
            const high = data.high.toFixed(currentPrecision);
            const low = data.low.toFixed(currentPrecision);
            const close = data.close.toFixed(currentPrecision);
            const isUp = close >= open;
            const priceClass = isUp ? 'up' : 'down';
            const arrow = isUp ? '↑' : '↓';

           tooltip.innerHTML = `
                    <div><span class="label">日期:</span><span class="value">${formatDateTime(param.time)}</span></div>
                    <div><span class="label">开盘:</span><span class="value ${priceClass}">${open}</span></div>
                    <div><span class="label">最高:</span><span class="value ${priceClass}">${high}</span></div>
                    <div><span class="label">最低:</span><span class="value ${priceClass}">${low}</span></div>
                    <div><span class="label">收盘:</span><span class="value ${priceClass}">${close} ${arrow}</span></div>
                `;

            const x = param.point.x + 15;
            const y = param.point.y + 15;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
            tooltip.style.display = 'block';
        }

        // 成交量标签更新函数
        function updateVolumeLabel(volume) {
            // 格式化成交量数值
            let formattedVolume;
            if (volume >= 100000000) {
                formattedVolume = (volume / 100000000).toFixed(2) + '亿';
            } else if (volume >= 10000) {
                formattedVolume = (volume / 10000).toFixed(2) + '万';
            } else {
                formattedVolume = volume.toLocaleString();
            }

            volumeLabel.textContent = `成交量: ${formattedVolume}`;
            volumeLabel.style.display = 'block';
        }


        // ========== 方法1：使用标记（Markers）显示缺口 ==========

        // 存储缺口 markers，与高低价 markers 合并
        let gapMarkers = [];

        function displayGapsWithMarkers(gaps) {
            gapMarkers = gaps.map(gap => ({
                time: gap.trade_datetime,
                position: gap.position,
                color: gap.color,
                shape: gap.shape,
                text: gap.text
            }));
        }

        displayGapsWithMarkers(gapsData);

        // 缺口显示开关
        const showGapsToggle = document.getElementById('showGapsToggle');

        // 应用缺口开关初始状态(从 localStorage 读回)
        showGapsToggle.checked = lsGetBool('gaps:visible', true);
        showGapsToggle.addEventListener('change', () => {
            lsSetBool('gaps:visible', showGapsToggle.checked);
            updateHighLowMarkers();
        });


        // ========== 可见范围最高/最低价标注 ==========

        function updateHighLowMarkers() {
            const timeRange = chart.timeScale().getVisibleRange();
            if (!timeRange) return;

            // 筛选可见范围内的 K 线
            const visibleCandles = candleData.filter(d => d.time >= timeRange.from && d.time <= timeRange.to);
            if (visibleCandles.length === 0) return;

            // 找最高价和最低价
            let highCandle = visibleCandles[0];
            let lowCandle = visibleCandles[0];
            for (const c of visibleCandles) {
                if (c.high > highCandle.high) highCandle = c;
                if (c.low < lowCandle.low) lowCandle = c;
            }

            const hlMarkers = [
                {
                    time: highCandle.time,
                    position: 'aboveBar',
                    color: '#ef5350',
                    shape: 'arrowDown',
                    text: 'H ' + highCandle.high.toFixed(currentPrecision),
                },
                {
                    time: lowCandle.time,
                    position: 'belowBar',
                    color: '#26a69a',
                    shape: 'arrowUp',
                    text: 'L ' + lowCandle.low.toFixed(currentPrecision),
                },
            ];

            // 合并缺口 markers 和高低价 markers（受开关控制），按时间排序
            const activeGapMarkers = showGapsToggle && showGapsToggle.checked ? gapMarkers : [];
            const allMarkers = [...activeGapMarkers, ...hlMarkers].sort((a, b) => {
                if (a.time < b.time) return -1;
                if (a.time > b.time) return 1;
                return 0;
            });
            candlestickSeries.setMarkers(allMarkers);
        }

        // 监听可见范围变化，更新高低价标注
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
            updateHighLowMarkers();
        });

        // 初始标注
        updateHighLowMarkers();

    }
</script>

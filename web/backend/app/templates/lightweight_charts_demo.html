<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Charts Demo</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        #chart {
            width: 100%;
            height: 600px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .info h3 {
            margin-top: 0;
            color: #333;
        }

        .info p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Lightweight Charts 简单示例</h1>
        <div id="chart"></div>

        <div class="info">
            <h3>说明</h3>
            <p>这是一个使用 TradingView Lightweight Charts 的简单示例。</p>
            <p>图表显示了 {{ candle_count }} 根K线数据。</p>
            <p>特性：支持缩放、平移、十字光标悬停显示详细信息。</p>
        </div>
    </div>

    <script>
        // 从后端传入的数据
        const candleData = {{ candle_data | safe }};

        console.log('收到的K线数据:', candleData);
        console.log('数据类型:', typeof candleData);
        console.log('数据长度:', Array.isArray(candleData) ? candleData.length : '不是数组');

        // 检查数据是否有效
        if (!candleData || !Array.isArray(candleData) || candleData.length === 0) {
            console.error('K线数据无效！', candleData);
            document.getElementById('chart').innerHTML = '<p style="color:red;text-align:center;padding-top:250px;">数据加载失败，请查看控制台错误信息</p>';
        } else {
            // 创建图表
            const chartContainer = document.getElementById('chart');
            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 600,
                layout: {
                    background: { color: '#ffffff' },
                    textColor: '#333',
                },
                grid: {
                    vertLines: { color: '#e0e0e0' },
                    horzLines: { color: '#e0e0e0' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#ccc',
                },
                timeScale: {
                    borderColor: '#ccc',
                    timeVisible: true,
                },
            });

            // 创建K线系列
            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',        // 上涨颜色（绿色）
                downColor: '#ef5350',      // 下跌颜色（红色）
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            // 设置数据
            try {
                candlestickSeries.setData(candleData);

                // 自动调整显示范围
                chart.timeScale().fitContent();

                // 响应式调整
                window.addEventListener('resize', () => {
                    chart.applyOptions({
                        width: chartContainer.clientWidth
                    });
                });

                console.log('图表已加载，共', candleData.length, '根K线');
            } catch (error) {
                console.error('设置K线数据失败:', error);
                document.getElementById('chart').innerHTML = '<p style="color:red;text-align:center;padding-top:250px;">图表渲染失败: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
